<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Pictures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Dancing+Script:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-lights"></div>

  <main>
    <p class="eyebrow">you're in</p>
    <h1>A few of my favorite moments with you</h1>

    <div class="carousel">
      <button class="arrow prev" aria-label="Previous">‹</button>
      <div class="slide-frame" id="slideFrame"></div>
      <button class="arrow next" aria-label="Next">›</button>
    </div>

    <div class="dots" id="dots"></div>

    <div>
      <a href="reason.html" class="btn-seal">Next page💌</a>
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    guardPage();

    let current = 0;
    const frame = document.getElementById("slideFrame");
    const dotsWrap = document.getElementById("dots");

    function render() {
      frame.innerHTML = "";
      const src = CONFIG.media[current];
      let el;

      if (isVideoSrc(src)) {
        el = document.createElement("video");
        el.src = src;
        el.controls = true;
        el.playsInline = true;
        el.addEventListener("error", () => {
          const fallback = document.createElement("img");
          fallback.alt = "A memory together";
          fallback.src = MEDIA_PLACEHOLDER;
          frame.replaceChild(fallback, el);
        }, { once: true });
      } else {
        el = document.createElement("img");
        el.alt = "A memory together";
        el.src = src;
        el.addEventListener("error", () => { el.src = MEDIA_PLACEHOLDER; }, { once: true });
      }

      frame.appendChild(el);

      const idxBadge = document.createElement("div");
      idxBadge.className = "slide-index";
      idxBadge.textContent = (current + 1) + " / " + CONFIG.media.length;
      frame.appendChild(idxBadge);

      [...dotsWrap.children].forEach((d, i) => d.classList.toggle("active", i === current));
    }

    function buildDots() {
      CONFIG.media.forEach((src, i) => {
        const d = document.createElement("button");
        d.className = "dot";
        d.setAttribute("aria-label", "Go to " + (isVideoSrc(src) ? "video" : "photo") + " " + (i + 1));
        d.addEventListener("click", () => { current = i; render(); });
        dotsWrap.appendChild(d);
      });
    }

    function go(delta) {
      current = (current + delta + CONFIG.media.length) % CONFIG.media.length;
      render();
    }

    document.querySelector(".prev").addEventListener("click", () => go(-1));
    document.querySelector(".next").addEventListener("click", () => go(1));
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") go(-1);
      if (e.key === "ArrowRight") go(1);
    });

    // Autoplay only advances past photos — videos wait for you to move on
    // manually so playback never gets cut off.
    setInterval(() => {
      if (!isVideoSrc(CONFIG.media[current])) go(1);
    }, 5000);

    buildDots();
    render();
  </script>
</body>
</html>
